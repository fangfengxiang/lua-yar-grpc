name: Release

# Triggered when a version tag (v*) is pushed.
# Convention: tag name = v<version>, e.g. v0.1.0, v0.2.0-rc1
#
# Rockspec strategy (industry convention, same as lua-yar / lua-resty-http / lua-cjson):
#   - Only lua-yar-grpc-scm-1.rockspec lives in the repo (single source of truth)
#   - Versioned rockspec is GENERATED by CI from scm at release time
#   - Revision (-1, -2, ...) is auto-determined by querying luarocks.org:
#       new version  → rev 1
#       re-publish   → max(existing rev) + 1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  # ── Generate versioned rockspec from scm, auto-determine revision ──
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.revision.outputs.revision }}
      rockspec: ${{ steps.rockspec.outputs.rockspec }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        # v0.1.0 -> 0.1.0,  v0.2.0-rc1 -> 0.2.0-rc1
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync version across all sources
        # Auto-fix version drift before publishing. Runs version-manager.sh
        # sync (driven by .versions) to align all version sources to the tag
        # version. If any file changed, commit + push to main; then check.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Tag version: $VERSION"
          chmod +x scripts/version-manager.sh
          if scripts/version-manager.sh sync "$VERSION"; then
            echo "No version drift — all sources at $VERSION"
          else
            echo "Version drift detected and auto-synced, committing to main"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $(scripts/version-manager.sh list)
            git commit -m "chore: sync version to $VERSION [skip ci]"
            git push origin HEAD:main || \
              echo "::warning::Could not push version sync to main (new commits after tag). Version synced in CI workspace only."
          fi
          # Verify consistency — fail the job if any source is still wrong
          scripts/version-manager.sh check "$VERSION"

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.1'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Determine revision (query luarocks.org)
        id: revision
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Query luarocks.org for existing revisions of this version
          EXISTING=$(luarocks search lua-yar-grpc --porcelain 2>/dev/null \
            | awk '/^lua-yar-grpc/ {print $2}' \
            | grep "^${VERSION}-" \
            | sed "s/^${VERSION}-//" \
            | sort -V \
            | tail -1)
          if [ -n "$EXISTING" ]; then
            REV=$((EXISTING + 1))
            echo "Version ${VERSION} already on luarocks.org (rev ${EXISTING}), bumping to rev ${REV}"
          else
            REV=1
            echo "New version ${VERSION}, using rev 1"
          fi
          echo "revision=${REV}" >> $GITHUB_OUTPUT

      - name: Generate versioned rockspec from scm
        id: rockspec
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REV="${{ steps.revision.outputs.revision }}"
          ROCKSPEC="lua-yar-grpc-${VERSION}-${REV}.rockspec"
          # Transform scm -> versioned: version string + source (branch -> tag)
          sed -e "s/version = \"scm-1\"/version = \"${VERSION}-${REV}\"/" \
              -e "s/branch = \"main\"/tag = \"v${VERSION}\"/" \
              lua-yar-grpc-scm-1.rockspec > "$ROCKSPEC"
          echo "=== Generated ${ROCKSPEC} ==="
          cat "$ROCKSPEC"
          echo "rockspec=${ROCKSPEC}" >> $GITHUB_OUTPUT

      - name: Upload rockspec artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockspec
          path: lua-yar-grpc-*.rockspec

  # ── Create GitHub Release with tarball + rockspec ──
  release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download rockspec
        uses: actions/download-artifact@v4
        with:
          name: rockspec

      - name: Create source tarball
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          git archive --format=tar.gz \
            --prefix=lua-yar-grpc-${VERSION}/ \
            -o lua-yar-grpc-${VERSION}.tar.gz HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: lua-yar-grpc v${{ needs.prepare.outputs.version }}
          body: |
            纯 Lua 实现的 gRPC ↔ Yar 协议流转换库，运行时无关，零 ngx.* 依赖。

            ## 安装

            ```bash
            luarocks install lua-yar-grpc
            ```

            ## 主要特性

            - 正向转换（Yar → gRPC）：YAR 位置参数 → protobuf 编码 → gRPC 帧
            - 反向转换（gRPC → Yar）：pb 解码 → 提取参数 → 返回 YAR method + params
            - gRPC 帧编解码 / 消息映射 / 状态码映射 / deadline 解析
            - 纯协议转换，不创建 yar.client，传输由调用方负责
          generate_release_notes: true
          # Tags containing a hyphen (e.g. v0.1.0-rc1) are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            lua-yar-grpc-${{ needs.prepare.outputs.version }}.tar.gz
            ${{ needs.prepare.outputs.rockspec }}

      - name: Deploy approval link
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "LuaRocks waiting for approval: $URL"
          {
            echo "## LuaRocks 等待审批"
            echo ""
            echo "release 已完成，luarocks 已暂停等待审批。点击下面链接进入审批："
            echo ""
            echo "审批发布: [$URL]($URL)"
            echo ""
            echo "到 run 页面顶部点 \`Review deployments\` → 选 \`deploy\` → Approve"
          } >> $GITHUB_STEP_SUMMARY

  # ── Publish to LuaRocks.org ──
  # Requires LUAROCKS_API_KEY secret (Settings → Secrets → Actions).
  # If not configured, upload is skipped; lint still runs.
  luarocks:
    needs: [release, prepare]
    environment: deploy   # waits for manual approval in GitHub UI before uploading
    runs-on: ubuntu-latest
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download rockspec
        uses: actions/download-artifact@v4
        with:
          name: rockspec

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.1'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Lint rockspec
        run: luarocks lint "${{ needs.prepare.outputs.rockspec }}"

      - name: Diagnose API key & connectivity
        if: ${{ env.LUAROCKS_API_KEY != '' }}
        run: |
          echo "luarocks: $(luarocks --version)"
          KEY_CLEAN="$(printf '%s' "$LUAROCKS_API_KEY" | tr -d '\n\r \t')"
          echo "raw key length:   ${#LUAROCKS_API_KEY}"
          echo "clean key length: ${#KEY_CLEAN}"
          if [ "${#LUAROCKS_API_KEY}" != "${#KEY_CLEAN}" ]; then
            echo "::warning::API key had stray whitespace/newline (auto-stripped). Re-save the secret cleanly to stop this recurring."
          fi
          code=$(curl -sS -o /tmp/s.json -w "%{http_code}" "https://luarocks.org/api/1/${KEY_CLEAN}/status")
          echo "luarocks.org /status HTTP code: ${code}"
          echo "response body:"; head -c 300 /tmp/s.json; echo
          if [ "$code" = "401" ]; then
            echo "::error::API key invalid (HTTP 401). Recreate at https://luarocks.org/settings/api-keys and update LUAROCKS_API_KEY secret."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected /status code $code. See body above."
            exit 1
          fi
          echo "LUAROCKS_API_KEY=${KEY_CLEAN}" >> "$GITHUB_ENV"

      - name: Upload to LuaRocks
        if: ${{ env.LUAROCKS_API_KEY != '' }}
        run: |
          KEY="$(printf '%s' "$LUAROCKS_API_KEY" | tr -d '\n\r \t')"
          luarocks upload "${{ needs.prepare.outputs.rockspec }}" --api-key="$KEY"
